[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plane-toolchain"
version = "0.2.0"
description = "Plane CE MCP extensions and project integration helpers"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["mcp==2.3.*", "httpx2>=2.16,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Hash-pinned deploy payload: no inline edits; container must listen publicly.
"src/plane_toolchain/ce_tools.py" = ["S104"]
