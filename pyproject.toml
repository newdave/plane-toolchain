[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plane-toolchain"
version = "0.3.0"
description = "Plane CE MCP extensions and project integration helpers"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = ["mcp==2.3.*", "httpx2>=2.16,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "pyyaml>=6,<7",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["plane_toolchain"]

[tool.coverage.report]
# Floor is the measured total (81.7% at PTC-80) rounded down. Raise it; never lower it.
fail_under = 81

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# F811: split test files import shared fixtures by name, then take them as arguments.
"tests/**" = ["S101", "F811"]
# Hash-pinned deploy payload: no inline edits; container must listen publicly.
"src/plane_toolchain/ce_tools.py" = ["S104"]
