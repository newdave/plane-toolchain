name: Check Plane MCP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: vars.PLANE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pinned toolchain revision
        env:
          TOOLCHAIN_REF: ${{ vars.PLANE_TOOLCHAIN_REF }}
        run: '[[ "$TOOLCHAIN_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: newdave/plane-toolchain
          ref: ${{ vars.PLANE_TOOLCHAIN_REF }}
          path: .plane-toolchain
          persist-credentials: false
      - name: Install locked dependencies
        working-directory: .plane-toolchain
        run: |
          python3 -m venv .bootstrap
          .bootstrap/bin/pip install --require-hashes --only-binary :all: -r examples/github/uv-requirements.txt
          .bootstrap/bin/uv sync --locked --no-dev
      - name: Call Plane through MCP
        working-directory: .plane-toolchain
        run: .bootstrap/bin/uv run --locked --no-dev python examples/github/plane_event.py
        env:
          PLANE_ENABLED: 'true'
          PLANE_MCP_URL: ${{ vars.PLANE_MCP_URL }}
          PLANE_WORKSPACE: ${{ vars.PLANE_WORKSPACE }}
          PLANE_PROJECT: ${{ vars.PLANE_PROJECT }}
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          PLANE_EXAMPLE_ACTION: check
