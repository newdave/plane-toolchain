name: Complete Plane task after verified deployment
on:
  workflow_call:
    inputs:
      workitem_id:
        required: true
        type: string
      deployment_verified:
        description: Caller must pass true only after deployment and health checks pass
        required: true
        type: boolean
    secrets:
      PLANE_API_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: plane-complete-${{ inputs.workitem_id }}
  cancel-in-progress: false
jobs:
  preconditions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require trusted event, default branch and enablement
        env:
          PLANE_ENABLED: ${{ vars.PLANE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          DEPLOYMENT_VERIFIED: ${{ inputs.deployment_verified }}
        run: |
          [[ "$PLANE_ENABLED" == 'true' ]] || { echo '::error::PLANE_ENABLED is not true'; exit 1; }
          case "$EVENT_NAME" in
            workflow_dispatch|push|release|schedule) ;;
            *) echo "::error::Untrusted event $EVENT_NAME; Plane writes refused"; exit 1 ;;
          esac
          [[ "$REF" == "$DEFAULT_REF" ]] || { echo '::error::Not the default branch'; exit 1; }
          [[ "$DEPLOYMENT_VERIFIED" == 'true' ]] || { echo '::error::Deployment not verified'; exit 1; }
  complete:
    needs: preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pinned toolchain revision
        env:
          TOOLCHAIN_REF: ${{ vars.PLANE_TOOLCHAIN_REF }}
        run: '[[ "$TOOLCHAIN_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: newdave/plane-toolchain
          ref: ${{ vars.PLANE_TOOLCHAIN_REF }}
          path: .plane-toolchain
          persist-credentials: false
      - name: Install locked dependencies
        working-directory: .plane-toolchain
        run: |
          python3 -m venv .bootstrap
          .bootstrap/bin/pip install --require-hashes --only-binary :all: -r examples/github/uv-requirements.txt
          .bootstrap/bin/uv sync --locked --no-dev
      - name: Call Plane through MCP
        working-directory: .plane-toolchain
        run: .bootstrap/bin/uv run --locked --no-dev python examples/github/plane_event.py
        env:
          PLANE_ENABLED: 'true'
          PLANE_MCP_URL: ${{ vars.PLANE_MCP_URL }}
          PLANE_WORKSPACE: ${{ vars.PLANE_WORKSPACE }}
          PLANE_PROJECT: ${{ vars.PLANE_PROJECT }}
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          PLANE_EXAMPLE_ACTION: complete
          PLANE_WORKITEM_ID: ${{ inputs.workitem_id }}
          PLANE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PLANE_DEPLOYMENT_VERIFIED: ${{ inputs.deployment_verified }}
          PLANE_DONE_STATE_ID: ${{ vars.PLANE_DONE_STATE_ID }}
