name: release
on:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on the default branch and matches pyproject
        run: |
          set -euo pipefail
          # Works without persisted credentials because the repo is public; a private fork must supply a token.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" \
            || { echo "::error::$TAG is not on $DEFAULT_BRANCH"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match pyproject version $version"; exit 1; }
      - name: Require a successful CI check on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          passed=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length' \
            | awk '{ n += $1 } END { print n + 0 }')
          [ "$passed" -ge 1 ] \
            || { echo "::error::no successful 'check' run on $sha; wait for CI on the default branch"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          sha=$(git rev-parse HEAD)
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] \
            || { echo "::error::no CHANGELOG section for $version"; exit 1; }
          printf '\nPin: %s\n' "$sha" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" --verify-tag
