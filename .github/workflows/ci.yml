name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies and verify
        run: |
          python3 -m venv .bootstrap
          .bootstrap/bin/pip install 'uv==0.9.3'
          .bootstrap/bin/uv sync --locked
          .bootstrap/bin/uv run --locked ruff check .
          .bootstrap/bin/uv run --locked ruff format --check .
          .bootstrap/bin/uv run --locked pytest -q
