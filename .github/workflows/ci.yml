name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: actionlint shellcheck aqua:zizmorcore/zizmor
          cache: false
      - name: Install zsh for syntax check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Lint workflows and shell scripts
        run: mise run lint:ci
      - name: Install locked dependencies and verify
        run: |
          python3 -m venv .bootstrap
          .bootstrap/bin/pip install 'uv==0.9.3'
          .bootstrap/bin/uv sync --locked
          .bootstrap/bin/uv run --locked ruff check .
          .bootstrap/bin/uv run --locked ruff format --check .
          .bootstrap/bin/uv run --locked pytest -q
