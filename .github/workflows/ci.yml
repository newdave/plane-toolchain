name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          msg="$RUNNER_TEMP/commit-msg.txt"
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$msg"
            python3 scripts/check-commit-msg.py "$msg" || { echo "Bad commit message in $sha" >&2; exit 1; }
          done
          # Squash merge builds the commit message from the PR title and body.
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$msg"
          python3 scripts/check-commit-msg.py "$msg" || { echo "Bad PR title or body" >&2; exit 1; }
      - name: Install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: python node uv actionlint shellcheck aqua:zizmorcore/zizmor
      - name: Install zsh for syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh
          zsh --version | grep -q '^zsh 5\.9'
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tools/mcp-remote/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install locked dependencies
        run: mise run setup
      - name: Check
        run: mise run check
