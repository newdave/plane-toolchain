[tools]
python = "3.12.12"
node = "26.13.1"
uv = "0.9.3"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.32.0"

[hooks.enter]
shell = "zsh"
script = 'source "{{config_root}}/scripts/plane-prompt.zsh" "{{config_root}}"'

[hooks.leave]
shell = "zsh"
script = '(( ! $+functions[_plane_toolchain_prompt_remove] )) || _plane_toolchain_prompt_remove'

[tasks.setup]
run = ["uv sync --locked", "npm ci --ignore-scripts --no-audit --no-fund --prefix tools/mcp-remote"]
[tasks.lint]
run = ["uv run --locked ruff check .", "uv run --locked ruff format --check ."]
[tasks."lint:ci"]
run = [
  "actionlint .github/workflows/*.yml examples/github/*.yml",
  "zizmor --offline .github/workflows examples/github/*.yml",
  "shellcheck scripts/*.sh templates/project/*.sh",
  "zsh -n scripts/plane-prompt.zsh",
]
[tasks.test]
run = "uv run --locked pytest -q"
[tasks.check]
depends = ["lint", "lint:ci", "test"]
[tasks."plane:cli"]
run = "uv run --locked python -m plane_toolchain.cli"
[tasks."plane:enable"]
run = "env -u VIRTUAL_ENV uv run --locked python -m plane_toolchain.config enable"
[tasks."plane:disable"]
run = "env -u VIRTUAL_ENV uv run --locked python -m plane_toolchain.config disable"
[tasks."plane:status"]
run = "python3 src/plane_toolchain/session.py status"
[tasks."owner:plane:apply"]
run = "env -u VIRTUAL_ENV uv run --locked python -m plane_toolchain.config apply"
[tasks."owner:plane:revert"]
run = "env -u VIRTUAL_ENV uv run --locked python -m plane_toolchain.config revert"
[tasks."owner:plane-mcp-compat:apply"]
run = "uv run --locked python -m plane_toolchain.mcp_deploy apply"
[tasks."owner:plane-mcp-compat:revert"]
run = "uv run --locked python -m plane_toolchain.mcp_deploy revert"
[tasks."owner:plane-mcp-compat:check"]
run = "uv run --locked python -m plane_toolchain.mcp_deploy check"
[tasks."owner:plane-pages:apply"]
run = "uv run --locked python -m plane_toolchain.pages_deploy apply"
[tasks."owner:plane-pages:build"]
run = "uv run --locked python -m plane_toolchain.pages_deploy build"
[tasks."owner:plane-pages:revert"]
run = "uv run --locked python -m plane_toolchain.pages_deploy revert"
[tasks."owner:plane-pages:check"]
run = "uv run --locked python -m plane_toolchain.pages_deploy check"
[tasks."owner:plane-workspace-rename:check"]
run = "uv run --locked python -m plane_toolchain.workspace_rename check"
[tasks."owner:plane-workspace-rename:apply"]
run = "uv run --locked python -m plane_toolchain.workspace_rename apply"
[tasks."owner:plane-workspace-rename:revert"]
run = "uv run --locked python -m plane_toolchain.workspace_rename revert"
[tasks."plane:example"]
run = "uv run --locked python examples/github/plane_event.py"
[tasks."owner:github-examples:apply"]
run = "uv run --locked python scripts/github_examples.py apply"
[tasks."owner:github-examples:revert"]
run = "uv run --locked python scripts/github_examples.py revert"
[tasks."owner:project:apply"]
run = "env -u VIRTUAL_ENV uv run --locked python scripts/install_project.py apply"
[tasks."owner:project:label"]
run = "env -u VIRTUAL_ENV uv run --locked python scripts/install_project.py label"
[tasks."owner:project:revert"]
run = "env -u VIRTUAL_ENV uv run --locked python scripts/install_project.py revert"
